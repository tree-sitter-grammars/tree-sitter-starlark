[package]
name = "tree-sitter-starlark"
description = "Starlark grammar for tree-sitter, following the language spec"
version = "2.0.0"
authors = ["Amaan Qureshi <amaanq12@gmail.com>", "Andre Brisco"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "starlark"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-starlark"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "./grammar.js",
  "queries/*",
  "src/*",
  "./tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27"
# The reference parser, used by tests/spec_oracle.rs to check that this
# grammar accepts and rejects the same programs as the spec implementation.
starlark_syntax = "0.14"
