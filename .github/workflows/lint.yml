name: Lint

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - scripts/**
      - src/node-types.json
      - bindings/node/node-types.d.ts
      - bindings/node/node-types.d.cts
  pull_request:
    paths:
      - grammar.js
      - scripts/**
      - src/node-types.json
      - bindings/node/node-types.d.ts
      - bindings/node/node-types.d.cts

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION}}
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Check that the TypeScript node types are up to date
        run: |-
          npm run generate:types
          git diff --exit-code -- bindings/node/node-types.d.ts bindings/node/node-types.d.cts
